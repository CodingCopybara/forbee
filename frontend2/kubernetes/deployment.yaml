apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend2
  template:
    metadata:
      labels:
        app: frontend2
    spec:
      containers:
      - name: frontend2
        image: forbeeregistry.azurecr.io/frontend2:08250240
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_SGIS_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: next-public-sgis-consumer-key
              key: key
        envFrom:
        - configMapRef:
            name: frontend2-config
