# FastAPI Deployment (Python 추론 서비스)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  labels:
    app: fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      serviceAccountName: ai-service-account  # AI 서비스와 같은 Workload Identity 사용
      containers:
        - name: fastapi
          image: username/fastapi:latest
          ports:
            - containerPort: 8000
          env:
            - name: AZURE_STORAGE_ACCOUNT_URL
              valueFrom:
                configMapKeyRef:
                  name: azure-config
                  key: storage-account-url
            - name: AZURE_CONTAINER_NAME
              valueFrom:
                configMapKeyRef:
                  name: azure-config
                  key: container-name
            - name: USE_AZURE_STORAGE
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          readinessProbe:
            httpGet:
              path: '/health'
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/health'
              port: 8000
            initialDelaySeconds: 30
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

---

# FastAPI Service
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  labels:
    app: fastapi
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: fastapi