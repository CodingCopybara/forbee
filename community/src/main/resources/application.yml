server:
  port: 8085

spring:
  application:
    name: community

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # 파일 업로드
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # JPA & Cloud Stream 공통 설정은 각 프로필에 있음

  app:
    upload:
      base-dir: uploads

# 공통 로깅 (필요에 맞게 조절)
logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug
    org.springframework.web: DEBUG
    org.springframework.http.converter: TRACE
    org.springframework.web.filter.CorsFilter: DEBUG
    org.springframework.web.servlet.handler.SimpleUrlHandlerMapping: DEBUG

api:
  url:
    community: localhost:8082

# ===== CORS (백엔드 엔드포인트 /ai/wsas, /ai/rsas 접근 허용용) =====
cors:
  # 콤마(,)로 여러 원본 허용
  allowed-origins: "http://localhost:3000,https://your-frontend.example.com"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  max-age: 3600

# ===== Azure Storage (SAS 발급 파라미터 포함) =====
azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT:forbee}
    account-key: ${AZURE_STORAGE_KEY}
    container: ${AZURE_STORAGE_CONTAINER:blob}
    # 컨테이너 공개 여부(Blob public이면 true) — 공개면 업로드 후 blobUrl 그대로 표시 가능
    public-container: true
    sas:
      upload-expire-minutes: 15  # 업로드용 SAS 유효시간(분)
      read-expire-hours: 12      # 읽기용 SAS 유효시간(시간)


---
spring:
  profiles: default
  datasource:
    url: jdbc:mysql://forbee-community-db.mysql.database.azure.com:3306/community?useSSL=false
    username: forbeecommunity
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: community
          destination: forbee
          contentType: application/json
        event-out:
          destination: forbee
          contentType: application/json

---
spring:
  profiles: docker
  datasource:
    url: jdbc:mysql://forbee-community-db.mysql.database.azure.com:3306/community?useSSL=false
    username: forbeecommunity
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: community
          destination: forbee
          contentType: application/json
        event-out:
          destination: forbee
          contentType: application/json

api:
  url:
    community: community:8080
