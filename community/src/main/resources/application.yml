server:
  port: 8085

spring:
  application:
    name: community

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 공통 로깅 설정: CORS 필터 DEBUG
logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug
    org.springframework.web: DEBUG
    org.springframework.http.converter: TRACE
    org.springframework.web.filter.CorsFilter: DEBUG
    org.springframework.web.servlet.handler.SimpleUrlHandlerMapping: DEBUG

api:
  url:
    community: localhost:8082

---
spring:
  profiles: default
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: community
          destination: forbee
          contentType: application/json
        event-out:
          destination: forbee
          contentType: application/json

---
spring:
  profiles: docker
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: community
          destination: forbee
          contentType: application/json
        event-out:
          destination: forbee
          contentType: application/json

api:
  url:
    community: community:8080