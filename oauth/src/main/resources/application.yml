spring:
  datasource:
    url: jdbc:mysql://forbee-oauth-db.mysql.database.azure.com:3306/oauth?useSSL=true&serverTimezone=UTC&useLegacyDatetimeCode=false
    username: forbeeoauth
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true

---

spring:
  profiles: default
server:
  port: 8090

#logging:
#  level:
#    org.springframework: debug
---

spring:
  profiles: docker

server:
  port: 8080

