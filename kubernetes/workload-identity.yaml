apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service-account
  namespace: default
  annotations:
    azure.workload.identity/client-id: "${APPLICATION_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${TENANT_ID}"
---
apiVersion: v1
kind: Pod
metadata:
  name: ai-pod
  namespace: default
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: ai-service-account
  containers:
  - name: ai
    image: your-ai-image:latest
    env:
    - name: AZURE_STORAGE_ACCOUNT_URL
      value: "https://your-storage-account.blob.core.windows.net"
    - name: AZURE_CONTAINER_NAME
      value: "your-container"
    - name: SPRING_PROFILES_ACTIVE
      value: "docker"
    ports:
    - containerPort: 8083
