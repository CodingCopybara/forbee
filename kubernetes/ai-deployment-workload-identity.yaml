apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ai-service-account
      containers:
      - name: ai
        image: your-registry.azurecr.io/ai:latest
        ports:
        - containerPort: 8083
        env:
        - name: AZURE_STORAGE_ACCOUNT_URL
          value: "https://your-storage-account.blob.core.windows.net"
        - name: AZURE_CONTAINER_NAME
          value: "your-container"
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "my-kafka:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: default
spec:
  selector:
    app: ai
  ports:
  - port: 8083
    targetPort: 8083
  type: ClusterIP
