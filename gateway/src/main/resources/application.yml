
server:
  port: 8088

---


keycloak-client:
  server-url: http://localhost:9090
  realm: master

spring:
  config:
    activate:
      on-profile: default
  cloud:
    gateway:
      default-filters:
        - TokenRelay 
      routes:
        - id: community
          uri: http://localhost:8082
          predicates:
            - Path=/posts/**, /comments/**, //**, //**,  
        - id: tree
          uri: http://localhost:0
          predicates:
            - Path=/plants/**,  
        - id: user
          uri: http://localhost:0
          predicates:
            - Path=/users/**, /memberRequestLists/**,  
        - id: dashboard
          uri: http://localhost:0
          predicates:
            - Path= /maps/**
        - id: chatbot
          uri: http://localhost:0
          predicates:
            - Path=/chatbots/**,  
        - id: ai
          uri: http://localhost:8083
          predicates:
            - Path=/ai/**,  
        - id: frontend
          uri: http://localhost:8080
          predicates:
            - Path=/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${keycloak-client.server-url}/realms/${keycloak-client.realm}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: "<client-id>"
            client-secret: 
            redirect-uri: "gateway-path/login/oauth2/code/client-name"
            authorization-grant-type: authorization_code
            scope: openid
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak-client.server-url}/realms/${keycloak-client.realm}/protocol/openid-connect/certs

---

spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: community
          uri: http://community:8080
          predicates:
            - Path=/posts/**/comments/**//**//** 
        - id: tree
          uri: http://tree:8080
          predicates:
            - Path=/plants/** 
        - id: user
          uri: http://user:8080
          predicates:
            - Path=/users/**/memberRequestLists/** 
        - id: dashboard
          uri: http://dashboard:8080
          predicates:
            - Path= /maps/**
        - id: chatbot
          uri: http://chatbot:8080
          predicates:
            - Path=/chatbots/** 
        - id: ai
          uri: http://ai:8080
          predicates:
            - Path=/ai/** 
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${keycloak-client.server-url}/realms/${keycloak-client.realm}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: "<client-id>"
            client-secret: 
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            authorization-grant-type: authorization_code
            scope: openid
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak-client.server-url}/realms/${keycloak-client.realm}/protocol/openid-connect/certs

server:
  port: 8080
