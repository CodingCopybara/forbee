# src/main/resources/application.yml

##
## 1) 공통(default) 프로필
##
spring:
  config:
    activate:
      on-profile: default

  # --- 데이터베이스 & JPA
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  # --- Thymeleaf (UI 렌더링)
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # --- OpenAI API 키
openai:
  api-key: ${OPENAI_API_KEY}

  # --- 웹서버 포트 (로컬 테스트용)
server:
  port: 8080

  # --- Spring Cloud Stream Kafka (기존 설정)
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        event-in:
          destination: forbee
          group: chatbot
          contentType: application/json
        event-out:
          destination: forbee
          contentType: application/json

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug

##
## 2) docker 프로필
##
---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: true        # 도커용은 캐시 켜기

  cloud:
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092
      bindings:
        event-in:
          destination: forbee
          group: chatbot
          contentType: application/json
        event-out:
          destination: forbee
          contentType: application/json

server:
  port: 8080         # 도커 컨테이너도 8080

openai:
  api-key: ${OPENAI_API_KEY}
