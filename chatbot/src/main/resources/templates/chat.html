<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>🐝 양봉 챗봇</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .user { text-align: right; color: blue; margin: 10px; }
    .bot  { text-align: left;  color: green; margin: 10px; }
    textarea { width: 80%; height: 80px; }
    button   { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>🐝 양봉 전문가 챗봇</h2>

  <div th:each="msg : ${chatHistory}">
    <div class="user">🙋‍♂️ 나: <span th:text="${msg.request.text}"></span></div>
    <div class="bot">🤖 챗봇: <span th:text="${msg.response.text}"></span></div>
  </div>

  <form th:action="@{/chat}" method="post">
    <textarea name="question" placeholder="양봉에 대해 질문하세요..."></textarea><br><br>
    <button type="submit">질문하기</button>
  </form>
</body>
</html>
