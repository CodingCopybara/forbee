<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>양봉 전문가 챗봇</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="chat-container">
    <div class="header">🐝 양봉 전문가 챗봇</div>

    <div class="messages">
      {% for msg in history %}
        <div class="message {{ 'user' if msg.role=='user' else 'bot' }}">
          <strong>{{ '나' if msg.role=='user' else '챗봇' }}:</strong>
          {{ msg.content }}
        </div>
      {% endfor %}
    </div>

    <div class="footer">
      <form method="post">
        <textarea name="question" rows="2" placeholder="질문하세요..." required></textarea>
        <button type="submit">전송</button>
      </form>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const textarea = document.querySelector("textarea[name='question']");
      const form = textarea.closest("form");

      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          // Shift 없이 Enter → 폼 제출
          e.preventDefault();
          form.requestSubmit();  // form.submit() 대신 최신 API
        }
        // Shift+Enter는 기본 동작(줄바꿈) 허용
      });
    });
  </script>
</body>
</html>
