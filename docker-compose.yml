## dist/ 폴더 만들어주기
## cd frontend
## npm install  
## npm run build

## 루트에서 docker-compose up --build라고 치기

version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      - VUE_APP_API_HOST=http://springboot:8082
    networks:
      - forbee-net

  springboot:
    build: ./chatbot
    ports:
      - "8082:8082"
    networks:
      - forbee-net

  fastapi:
    build: ./chatbot_ai
    ports:
      - "8002:8002"   # 왼쪽 = 외부(로컬), 오른쪽 = 컨테이너 내부
    networks:
      - forbee-net


networks:
  forbee-net:
    driver: bridge
