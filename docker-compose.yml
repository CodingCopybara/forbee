  ai:
    depends_on: 
      - kafka
      - fastapi
    image: adoptopenjdk/maven-openjdk11:latest
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    command: mvn spring-boot:run
    ports:
      - 8083:8083
    working_dir: /usr/src
    volumes:
      - ./ai:/usr/src
      - ./maven-repo:/root/.m2

  fastapi:
    depends_on: 
      - kafka
    build: ./ai
    ports:
      - 8003:8003
    volumes:
      - ./ai:/usr/src
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=my-kafka:9092
      - KAFKA_TOPIC=forbee
      - OPENAI_API_KEY=${OPENAI_API_KEY}
