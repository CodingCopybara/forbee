  - deployment: DeployTree
    displayName: '트리 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runTree'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'tree/kubernetes'
              containers: '$(acrLoginServer)/tree:$(Build.BuildId)'