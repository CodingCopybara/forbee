trigger:
  batch: true
  branches:
    include:
    - release
  paths:
    include:
    - frontend2/**
    - gateway/**
    - oauth/**
    - user/**
    - ai/**
    - aiMap/**
    - chatbot/**
    - chatbot_ai/**
    - community/**
    - tree/**
variables:
  azureServiceConnection: 'forbee_rsg'
  acrLoginServer: 'forbeeregistry.azurecr.io'
  kubernetesServiceConnection: 'forbee-aks'

pool:
  vmImage: 'ubuntu-22.04'

stages:
- stage: Changes
  displayName: '변경 사항'
  jobs:
  - job: Change
    steps:
    - checkout: self
      fetchDepth: 2
    - script: |
      set -e
      CHANGED_FILES=$(git diff HEAD HEAD~1 --name-only)
      if echo "$CHANGED_FILES" | grep -q "frontend2"; then
        echo "##vso[task.setvariable variable=runFrontend;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "gateway"; then
        echo "##vso[task.setvariable variable=runGateway;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "oauth"; then
        echo "##vso[task.setvariable variable=runOauth;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "user"; then
        echo "##vso[task.setvariable variable=runUser;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep "ai" | grep -v -q "chatbot_ai"; then
        echo "##vso[task.setvariable variable=runAi;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "ai_python"; then
        echo "##vso[task.setvariable variable=runAiPython;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "aiMap"; then
        echo "##vso[task.setvariable variable=runAiMap;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "chatbot"; then
        echo "##vso[task.setvariable variable=runChatbot;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "chatbot_ai"; then
        echo "##vso[task.setvariable variable=runChatbotAi;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "community"; then
        echo "##vso[task.setvariable variable=runCommunity;isOutput=true]true"
      fi
      if echo "$CHANGED_FILES" | grep -q "tree"; then
        echo "##vso[task.setvariable variable=runTree;isOutput=true]true"
      fi
    name: setVars

- stage: BuildAndPush
  displayName: '도커 빌드 및 푸시'
  dependsOn: Changes
  jobs:

  - job: Frontend
    displayName: '프론트엔드'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runFrontend'], 'true'))
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: $(azureServiceConnection)
        repository: 'frontend2'
        command: 'buildAndPush'
        dockerfile: 'frontend2/Dockerfile'
        buildContext: 'frontend2'
        tags: |
          $(Build.BuildId)
          latest
        arguments: |
          --build-arg NEXT_PUBLIC_GW_URL="http://forbee.me"
          --build-arg NEXT_PUBLIC_SGIS_CONSUMER_KEY="$(sgisConsumerKey)"  # sgisConsumerKey 넣어줘야 함.

  - job: gateway
    displayName: '게이트웨이'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runGateway'], 'true'))
    steps:
    - task: JavaToolInstaller@1
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'preinstalled'
    - task: Maven@4
      inputs:
        mavenPomFile: 'gateway/pom.xml'
        goals: 'clean package'
        options: '-B -Dmaven.test.skip=true'
        publishJUnitResults: false
    - task: Docker@2
      inputs:
        containerRegistry: $(azureServiceConnection)
        repository: 'gateway'
        command: 'buildAndPush'
        dockerfile: 'gateway/Dockerfile'
        buildContext: 'gateway'
        tags: |
          $(Build.BuildId)
          latest

  - job: oauth
