        jdkSourceOption: 'preinstalled'
    - task: Maven@4
      inputs:
        mavenPomFile: 'oauth/pom.xml'
        goals: 'clean package'
        options: '-B -Dmaven.test.skip=true'
        publishJUnitResults: false
    - task: Docker@2
