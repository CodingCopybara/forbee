- stage: Deploy
  displayName: '쿠버네티스 배포'
  dependsOn: BuildAndPush
  jobs:
  - deployment: DeployFrontend
    displayName: '프론트엔드 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runFrontend'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'frontend2/kubernetes'
              containers: '$(acrLoginServer)/frontend2:$(Build.BuildId)'

  - deployment: DeployGateway
    displayName: '게이트웨이 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runGateway'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'gateway/kubernetes'
              containers: '$(acrLoginServer)/gateway:$(Build.BuildId)'

  - deployment: DeployOauth
    displayName: 'OAuth 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runOauth'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'oauth/kubernetes'
              containers: '$(acrLoginServer)/oauth:$(Build.BuildId)'

  - deployment: DeployUser
    displayName: 'User 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runUser'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'user/kubernetes'
              containers: '$(acrLoginServer)/user:$(Build.BuildId)'

  - deployment: DeployAi
    displayName: 'AI/Python 배포'
    condition: |
      and(
        succeeded(),
        or(
          eq(dependencies.Changes.outputs['Change.setVars.runAi'], 'true'),
          eq(dependencies.Changes.outputs['Change.setVars.runAiPython'], 'true')
        )
      )
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              sed -i 's|$(acrLoginServer)/ai:.*|$(acrLoginServer)/ai:$(Build.BuildId)|g' ai/kubernetes/deployment.yaml
              sed -i 's|$(acrLoginServer)/python:.*|$(acrLoginServer)/python:$(Build.BuildId)|g' ai/kubernetes/deployment.yaml
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'ai/kubernetes'

  - deployment: DeployAiMap
    displayName: 'AI 맵 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runAiMap'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'aiMap/kubernetes'
              containers: '$(acrLoginServer)/aimap:$(Build.BuildId)'

  - deployment: DeployChatbot
    displayName: '챗봇 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runChatbot'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'chatbot/kubernetes'
              containers: '$(acrLoginServer)/chatbot:$(Build.BuildId)'

  - deployment: DeployChatbotAi
    displayName: '챗봇 AI 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runChatbotAi'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'chatbot_ai/kubernetes'
              containers: '$(acrLoginServer)/chatbot_ai:$(Build.BuildId)'

  - deployment: DeployCommunity
    displayName: '커뮤니티 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runCommunity'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              command: 'apply'
              useConfigurationFile: true
              configuration: 'community/kubernetes'
