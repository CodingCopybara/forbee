- stage: Deploy
  displayName: '쿠버네티스 배포'
  dependsOn: BuildAndPush
  jobs:
  - deployment: DeployFrontend
    displayName: '프론트엔드 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runFrontend'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: 'frontend2/kubernetes'
              TargetFolder: '$(Agent.BuildDirectory)/s/temp'
          - script: |
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: next-public-sgis-consumer-key
                namespace: default
              type: Opaque
              stringData:
                key: $(NEXT_PUBLIC_SGIS_CONSUMER_KEY)
              " > $(Agent.BuildDirectory)/s/temp/secret.yml
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: '$(Agent.BuildDirectory)/s/temp'
              containers: 'forbeeregistry.azurecr.io/frontend2:$(Build.BuildId)'

  - deployment: DeployGateway
    displayName: '게이트웨이 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runGateway'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: 'gateway/kubernetes'
              containers: 'forbeeregistry.azurecr.io/gateway:$(Build.BuildId)'

  - deployment: DeployOauth
    displayName: 'OAuth 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runOauth'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: 'oauth/kubernetes'
              TargetFolder: '$(Agent.BuildDirectory)/s/temp'
          - script: |
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: db-secret
                namespace: default
              type: Opaque
              stringData:
                DB_PASSWORD: $(DB_PASSWORD)
              " > $(Agent.BuildDirectory)/s/temp/secret.yml
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: '$(Agent.BuildDirectory)/s/temp'
              containers: 'forbeeregistry.azurecr.io/oauth:$(Build.BuildId)'

  - deployment: DeployUser
    displayName: 'User 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runUser'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: 'user/kubernetes'
              TargetFolder: '$(Agent.BuildDirectory)/s/temp'
          - script: |
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: db-secret
                namespace: default
              type: Opaque
              stringData:
                DB_PASSWORD: $(DB_PASSWORD)
                AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
              " > $(Agent.BuildDirectory)/s/temp/db-secret.yml
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: azure-storage-secret
                namespace: default
              type: Opaque
              stringData:
                AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
              " > $(Agent.BuildDirectory)/s/temp/azure-storage-secret.yml
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: '$(Agent.BuildDirectory)/s/temp'
              containers: 'forbeeregistry.azurecr.io/user:$(Build.BuildId)'

  - deployment: DeployAi
    displayName: 'AI/Python 배포'
    condition: |
      and(
        succeeded(),
        or(
          eq(dependencies.Changes.outputs['Change.setVars.runAi'], 'true'),
          eq(dependencies.Changes.outputs['Change.setVars.runAiPython'], 'true')
        )
      )
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: 'ai/kubernetes'
              TargetFolder: '$(Agent.BuildDirectory)/s/temp'
          - script: |
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secrets
                namespace: default
              type: Opaque
              stringData:
                DB_PASSWORD: $(DB_PASSWORD)
                AZURE_STORAGE_ACCESS_KEY: $(AZURE_STORAGE_ACCESS_KEY)
                OPENAI_API_KEY: $(OPENAI_API_KEY)
              " > $(Agent.BuildDirectory)/s/temp/secret.yml
          - script: |
              sed -i 's|forbeeregistry.azurecr.io/ai:.*|forbeeregistry.azurecr.io/ai:$(Build.BuildId)|g' $(Agent.BuildDirectory)/s/temp/deployment.yml
              sed -i 's|forbeeregistry.azurecr.io/python:.*|forbeeregistry.azurecr.io/python:$(Build.BuildId)|g' $(Agent.BuildDirectory)/s/temp/deployment.yml
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: '$(Agent.BuildDirectory)/s/temp'

  - deployment: DeployAiMap
    displayName: 'AI 맵 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runAiMap'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: 'aiMap/kubernetes'
              TargetFolder: '$(Agent.BuildDirectory)/s/temp'
          - script: |
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: sgis-api-keys
                namespace: default
              type: Opaque
              stringData:
                SGIS_CONSUMER_KEY: $(SGIS_CONSUMER_KEY)
                SGIS_SECRET_KEY: $(SGIS_SECRET_KEY)
              " > $(Agent.BuildDirectory)/s/temp/secret.yml
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: '$(Agent.BuildDirectory)/s/temp'
              containers: 'forbeeregistry.azurecr.io/aimap:$(Build.BuildId)'

  - deployment: DeployChatbot
    displayName: '챗봇 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runChatbot'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: 'chatbot/kubernetes'
              containers: 'forbeeregistry.azurecr.io/chatbot:$(Build.BuildId)'

  - deployment: DeployChatbotAi
    displayName: '챗봇 AI 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runChatbotAi'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: 'chatbot_ai/kubernetes'
              TargetFolder: '$(Agent.BuildDirectory)/s/temp'
          - script: |
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secrets
                namespace: default
              type: Opaque
              stringData:
                DB_PASSWORD: $(DB_PASSWORD)
                AZURE_STORAGE_ACCESS_KEY: $(AZURE_STORAGE_ACCESS_KEY)
                OPENAI_API_KEY: $(OPENAI_API_KEY)
              " > $(Agent.BuildDirectory)/s/temp/secret.yml
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: '$(Agent.BuildDirectory)/s/temp'
              containers: 'forbeeregistry.azurecr.io/chatbot_ai:$(Build.BuildId)'

  - deployment: DeployCommunity
    displayName: '커뮤니티 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runCommunity'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CopyFiles@2
            inputs:
              SourceFolder: 'community/kubernetes'
              TargetFolder: '$(Agent.BuildDirectory)/s/temp'
          - script: |
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: db-secret
                namespace: default
              type: Opaque
              stringData:
                DB_PASSWORD: $(DB_PASSWORD)
              " > $(Agent.BuildDirectory)/s/temp/db-secret.yml
              echo "
              apiVersion: v1
              kind: Secret
              metadata:
                name: azure-storage-key-secret
                namespace: default
              type: Opaque
              stringData:
                AZURE_STORAGE_KEY: $(AZURE_STORAGE_KEY)
              " > $(Agent.BuildDirectory)/s/temp/azure-storage-key-secret.yml
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: '$(Agent.BuildDirectory)/s/temp'
              containers: 'forbeeregistry.azurecr.io/community:$(Build.BuildId)'

  - deployment: DeployTree
    displayName: '트리 배포'
    condition: and(succeeded(), eq(dependencies.Changes.outputs['Change.setVars.runTree'], 'true'))
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            inputs:
              kubernetesServiceConnection: 'forbee-aks'
              action: 'deploy'
              manifests: 'tree/kubernetes'
              containers: 'forbeeregistry.azurecr.io/tree:$(Build.BuildId)'