tasks:
  - name: Start Spring Boot & FastAPI
    command: |
      cd chatbot
      mvn spring-boot:run &
      cd ../chatbot_ai
      uvicorn main:app --host 0.0.0.0 --port 8002

ports:
  - port: 8082
    onOpen: open-preview
  - port: 8002
    onOpen: open-preview

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
