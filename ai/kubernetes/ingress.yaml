# Ingress (외부 접근용)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-analysis-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/websocket-services: "ai"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
spec:
  ingressClassName: nginx
  rules:
  - host: image-analysis.yourdomain.com  # 실제 도메인으로 변경
    http:
      paths:
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: ai
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80