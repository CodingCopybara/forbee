apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: ai
        image: forbeeregistry.azurecr.io/ai:v4
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: docker
        envFrom:
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "500Mi"
            cpu: "250m"
          limits:
            memory: "800Mi"
            cpu: "1"
        ports:
        - containerPort: 8083
        readinessProbe:
          httpGet:
            path: '/actuator/health/readiness'
            port: 8083
          initialDelaySeconds: 180
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: '/actuator/health/liveness'
            port: 8083
          initialDelaySeconds: 180
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 5
      - name: python
        image: forbeeregistry.azurecr.io/python:test
        ports:
        - containerPort: 8003        
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "my-kafka:9092"
        - name: KAFKA_TOPIC
          value: "forbee"
        envFrom:
          - secretRef:
              name: app-secrets
        resources:
          requests:
            memory: "600Mi"
            cpu: "250m"
          limits:
            memory: "800Mi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: '/health'
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: '/health'
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 10          
          timeoutSeconds: 2
          failureThreshold: 3