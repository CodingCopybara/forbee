# Azure Blob Storage 설정
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-config
  namespace: default
data:
  storage-account-url: "https://forbeeimagestorage.blob.core.windows.net"
  container-name: "images"

---

# AI Service용 ServiceAccount (Workload Identity)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service-account
  namespace: default
  annotations:
    azure.workload.identity/client-id: "YOUR_WORKLOAD_IDENTITY_CLIENT_ID"
  labels:
    azure.workload.identity/use: "true"