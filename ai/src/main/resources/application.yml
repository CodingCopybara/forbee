server:
  port: 8083

# management:
#   endpoints:
#     web:
#       exposure:
#         include: env,health,info

---

spring:
  config:
    activate:
      on-profile: default
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://forbee-ai-db.mysql.database.azure.com:3306/ai?useSSL=true&requireSSL=false
    username: forbeeai
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai
      auto-offset-reset: earliest
    # listener:
    #   auto-startup: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/master/protocol/openid-connect/certs

  # cloud:
