server:
  port: 8083

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none

fastapi:
  url: ${FASTAPI_URL:http://localhost:8003}

azure:
  storage:
    account-url: ${AZURE_STORAGE_ACCOUNT_URL:https://aivle26storage.blob.core.windows.net}
    container-name: ${AZURE_CONTAINER_NAME:container}

logging:
  level:
    root: INFO
