  #               key:
  #                 serde: org.apache.kafka.common.serialization.Serdes$StringSerde
  #               value:
  #                 serde: org.apache.kafka.common.serialization.Serdes$StringSerde
  #     bindings:
  #       event-in:
  #         group: ai
  #         destination: forbee
  #         contentType: application/json
  #       event-out:
  #         destination: forbee
  #         contentType: application/json

fastapi:
  url: http://localhost:8003

azure:
  storage:
    account-url: https://forbee.blob.core.windows.net
    container-name: blob

    # AKS 액세스 키 인증 때문에 추가
    account-key: ${AZURE_STORAGE_ACCESS_KEY}
    account-name: forbee

logging:
  level:
    root: INFO
