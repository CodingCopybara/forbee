spring:
  config:
    activate:
      on-profile: default
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/master/protocol/openid-connect/certs
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false
  cloud:
    function:
      definition: rawAnalysisResultIn;finalResultIn
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        rawAnalysisResultIn-in-0:
          destination: analysis-results
          group: ai
        # finalResultIn-in-0:
        #   destination: notification-topic
        #   group: ai

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug

fastapi:
  url: http://localhost:8000

azure:
  storage:
    endpoint: "https://aivle26storage.blob.core.windows.net"
    container-name: "images"

server:
  port: 8081
  # port: 0

---

spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/master/protocol/openid-connect/certs
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false
  cloud:
    function:
      definition: rawAnalysisResultIn;finalResultIn
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092
      bindings:
        rawAnalysisResultIn-in-0:
          destination: analysis-results
          group: ai-backend-azure-saver
        # finalResultIn-in-0:
        #   destination: notification-topic
        #   group: ai-backend-notifier

fastapi:
  url: http://fastapi:8000

azure:
  storage:
    endpoint: "https://aivle26storage.blob.core.windows.net"
    container-name: "container"
